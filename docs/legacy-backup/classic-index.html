<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>線上簽核系統</title>
  <link rel="icon" id="app-favicon" type="image/png" href="/img/argo-logo.png" />
  <link rel="shortcut icon" id="app-favicon-shortcut" type="image/png" href="/img/argo-logo.png" />
  <link rel="apple-touch-icon" id="app-favicon-apple" href="/img/argo-logo.png" />
  <link rel="stylesheet" href="/css/style.css?v=20261004_split_act" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Auth screens：預設顯示，避免 JS 未載入時整頁空白 -->
    <div id="auth-view" class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <img class="brand-logo brand-logo-auth" src="/img/argo-logo.png" alt="ARGO" width="1048" height="289" decoding="async" />
          <div class="company-name">線上簽核系統</div>
          <h1>線上簽核</h1>
          <p>自訂流程 · 紀錄留存 · PDF 匯出</p>
          <div class="app-version" id="auth-version" title="系統版本">v—</div>
        </div>
        <form id="login-form" class="auth-form">
          <label>帳號<input name="username" autocomplete="username" required placeholder="請輸入帳號" value="" /></label>
          <label>密碼<input name="password" type="password" autocomplete="current-password" required placeholder="請輸入密碼" value="" /></label>
          <button type="submit" class="btn primary block">登入</button>
        </form>
        <div id="auth-error" class="error-msg hidden"></div>
        <div class="auth-version-foot muted app-version" id="auth-version-foot">線上簽核系統</div>
      </div>
    </div>

    <!-- Main app -->
    <div id="main-view" class="main-layout hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img class="brand-logo brand-logo-side" src="/img/argo-logo.png" alt="ARGO" width="1048" height="289" decoding="async" />
          <div class="sidebar-brand-text">
            <strong>線上簽核</strong>
            <span class="muted company-name-sm">線上簽核系統</span>
          </div>
        </div>
        <nav class="nav">
          <button type="button" class="nav-item active" data-page="dashboard">總覽</button>
          <button type="button" class="nav-item" data-page="inbox">待我簽核 <span id="badge-pending" class="badge hidden">0</span></button>
          <button type="button" class="nav-item" data-page="mine">我的申請</button>
          <button type="button" class="nav-item" data-page="records">簽核紀錄</button>
          <button type="button" class="nav-item" data-page="new-request">新增申請</button>
          <button type="button" class="nav-item perm-nav hidden" data-perm="workflows" data-page="workflows">簽核流程</button>
          <button type="button" class="nav-item perm-nav hidden" data-perm="backups" data-page="backups">備份資料</button>
          <button type="button" class="nav-item perm-nav hidden" data-perm="leave_report" data-page="leave-report">請假報表</button>
          <button type="button" class="nav-item perm-nav hidden" data-perm="users_leave" data-page="users">成員名單</button>
          <button type="button" class="nav-item admin-only hidden" data-page="departments">部門</button>
          <button type="button" class="nav-item" data-page="settings">帳號設定</button>
          <button type="button" class="nav-item hidden" id="nav-line-settings" data-page="line-settings">LINE 通知</button>
          <button type="button" class="nav-item hidden" data-page="system-settings">系統設定</button>
        </nav>
        <div class="sidebar-user">
          <div class="avatar" id="user-avatar">U</div>
          <div class="user-meta">
            <div id="user-name">—</div>
            <div class="muted" id="user-role">—</div>
          </div>
          <button type="button" id="btn-logout" class="btn ghost sm" title="登出">登出</button>
        </div>
        <div class="sidebar-version app-version" id="sidebar-version" title="系統版本">v—</div>
      </aside>

      <main class="content">
        <header class="page-header">
          <h2 id="page-title">總覽</h2>
          <div id="page-actions"></div>
        </header>
        <div id="page-body" class="page-body"></div>
      </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-panel" id="modal-panel"></div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="/vendor/pdfjs/pdf.min.js"></script>
  <script src="/js/tw-calendar.js"></script>
  <script src="/js/rich-editor.js"></script>
  <script src="/js/ui-helpers.js?v=20261003_fixnav"></script>
  <script src="/js/pdf-form-designer.js?v=20261004_paper_drag"></script>
  <script src="/js/flow-editor.js?v=20261003_fixnav"></script>
  <script src="/js/app.js?v=20261004_split_act"></script>
  <script src="/js/pages-dashboard.js?v=20261003_fixnav"></script>
  <script src="/js/pages-request-fields.js?v=20261003_fixnav"></script>
  <script src="/js/pages-request-table.js?v=20261003_fixnav"></script>
  <script src="/js/pages-request-view.js?v=20261003_fixnav"></script>
  <script src="/js/pages-request-list.js?v=20261004_phrases"></script>
  <script src="/js/pages-request-new.js?v=20261003_fixnav"></script>
  <script src="/js/pages-request-detail.js?v=20261004_split_act"></script>
  <script src="/js/pages-workflows.js?v=20261004_paper_drag"></script>
  <script src="/js/pages-backups.js?v=20261003_fixnav"></script>
  <script src="/js/pages-leave-report.js?v=20261004_phrases"></script>
  <script src="/js/pages-users.js?v=20261003_fixnav"></script>
  <script src="/js/pages-departments.js?v=20261003_fixnav"></script>
  <script src="/js/pages-audit.js?v=20261003_fixnav"></script>
  <script src="/js/pages-settings.js?v=20261004_phrases"></script>
  <script src="/js/pages-line.js?v=20261003_fixnav"></script>
  <script src="/js/pages-system.js?v=20261003_fixnav"></script>
</body>
</html>
